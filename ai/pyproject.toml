[project]
name = "sentinel-ai"
version = "2.0.0"
description = "Sentinel-X — IA locale : maintenance prédictive (anomalies capteurs) et détection d'intrus (vision)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "paho-mqtt>=2.0",
    "matplotlib>=3.8",
    "opencv-python>=4.8",
    "ultralytics>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sentinel-ai = "sentinel_ai.__main__:main"

[tool.setuptools.packages.find]
include = ["sentinel_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py311"
