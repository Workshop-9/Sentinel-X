# =====================================================================
#  Sentinel-X — configuration de la partie IA
#  Aucun secret ici : identifiants MQTT et jeton vidéo vont dans .env
#  (voir .env.example). Les chemins relatifs partent du dossier ai/.
# =====================================================================

[device]
id = "SX-001"                       # boîtier par défaut (alarme, vision)

[mqtt]
host = "192.168.137.1"              # broker Mosquitto TLS du PC serveur
port = 8883
tls = true
ca_cert = "certs/ca.crt"            # CA « SentinelX-CA-G9 » (hors Git)
tls_check_hostname = true           # false si le certificat n'a pas l'IP en SAN
keepalive = 30
topic_telemetry = "sentinel/+/telemetry"
topic_anomaly = "sentinel/{device}/anomaly"
topic_vision = "sentinel/{device}/vision"
topic_cmd = "sentinel/{device}/cmd"
topic_ai_status = "sentinel/{device}/ai/{service}/status"   # online / offline (retained)

[paths]
data_dir = "data"                   # télémétrie collectée (CSV)
artifacts_dir = "artifacts"         # modèles versionnés + rapports
captures_dir = "~/sentinel_captures" # photos d'intrus (hors Documents)

# ---------------------------------------------------------------------
#  Maintenance prédictive (détection d'anomalies sur séries temporelles)
# ---------------------------------------------------------------------
[anomaly.features]
window = 15                         # 15 mesures x 2 s = 30 s de dynamique
baseline_halflife = 150             # ligne de base adaptative : demi-vie 150 mesures (5 min)
reset_after_s = 600                 # > 10 min sans données : contexte perdu, on repart à zéro

[anomaly.model]
algorithm = "isolation_forest"      # isolation_forest | lof | ocsvm | robust_covariance
n_estimators = 200
random_state = 42

[anomaly.training]
train_frac = 0.6                    # découpage chronologique des données normales
calib_frac = 0.2                    # (le reste = test, jamais vu à l'entraînement)
target_fpr = 0.01                   # 1 % de mesures normales au-dessus du seuil appris
benchmark = ["isolation_forest", "lof", "ocsvm", "robust_covariance"]

[anomaly.gates]                     # le modèle n'est promu que s'il passe ces contrôles
max_false_alarms_per_hour = 2.0     # alarmes CONFIRMÉES à tort sur la période de test
max_test_fpr = 0.10                 # mesures isolées suspectes (glitchs ADC filtrés ensuite)
min_anomaly_recall = 0.80
min_scenarios_detected = 0.75
min_plateau_coverage = 0.90         # l'alerte doit rester active tant que l'incident dure

[anomaly.live]
consecutive = 3                     # anomalies d'affilée pour confirmer l'alarme (6 s)
auto_alarm = true                   # déclenche la sirène du boîtier si confirmé
max_freeze = 150                    # ligne de base gelée pendant une anomalie (max 5 min)

# ---------------------------------------------------------------------
#  Vision (détection d'intrus par webcam USB)
# ---------------------------------------------------------------------
[vision]
camera_index = 1                    # 1 = Logitech C270 (0 = webcam intégrée)
weights = "models/yolov8n.pt"
conf_min = 0.5
frame_width = 640
frame_height = 480
confirm_frames = 3                  # personne vue sur >= 3 des 5 dernières images
confirm_window = 5
cooldown_s = 10                     # au plus une alerte toutes les 10 s
auto_alarm = false                  # true = la vision déclenche aussi la sirène
show_window = true
captures_retention_days = 7         # RGPD : photos supprimées après 7 jours

[vision.stream]
enabled = true
host = "127.0.0.1"                  # 0.0.0.0 seulement avec jeton + pare-feu
port = 8081
max_clients = 4
fps = 10
